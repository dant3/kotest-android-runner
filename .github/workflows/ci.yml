name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # publishToMavenLocal is what JitPack runs (jitpack.yml): a broken publication shows up here,
      # not after the tag is pushed.
      - run: ./gradlew detekt :kotest-android-runner:publishToMavenLocal :e2e-test:assembleDebugAndroidTest

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Pull requests wait for a maintainer's approval of the `e2e` environment; main has been reviewed.
    environment: ${{ github.event_name == 'pull_request' && 'e2e' || '' }}
    # The latest Kotest is an early warning: a new Kotest release must not block unrelated pull requests.
    continue-on-error: ${{ matrix.kotest == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, orchestrator]
        kotest: [pinned, latest]
    name: e2e (${{ matrix.mode }}, kotest ${{ matrix.kotest }})
    env:
      GRADLE_ARGS: >-
        ${{ matrix.mode == 'orchestrator' && '-Pe2e.orchestrator' || '' }}
        ${{ matrix.kotest == 'latest' && '-Pkotest.version=6.+' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Kotest under test
        run: |
          ./gradlew -q :e2e-test:dependencyInsight --dependency kotest-framework-engine \
            --configuration debugAndroidTestRuntimeClasspath $GRADLE_ARGS | head -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the test APK
        run: ./gradlew :e2e-test:assembleDebugAndroidTest $GRADLE_ARGS

      - name: Run e2e on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew :e2e-test:connectedDebugAndroidTest $GRADLE_ARGS

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.mode }}-kotest-${{ matrix.kotest }}
          path: |
            e2e-test/build/outputs/androidTest-results
            e2e-test/build/reports/androidTests
